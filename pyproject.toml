[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-pilot"
version = "0.1.0"
description = "AI agent that operates your computer (Linux and Windows), powered by GPT or any OpenAI-compatible model."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.40",
    "playwright>=1.45",
    "pyautogui>=0.9.54",
    "mss>=9.0",
    "pillow>=10.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pilot = "pilot.cli:main"

[tool.setuptools.packages.find]
include = ["pilot*"]
